# ImageNet-256 B/2 smoke test on 1 x A100: 256 sphere-tracing samples (CFG 2.0,
# 250 steps) from the Hugging Face EMA checkpoint, plus a 20-step training run
# on a 10-class subset unpacked from the ImageNet tar (checks the training path,
# the VAE download and the checkpoint compatibility). No FID.
apiVersion: batch/v1
kind: Job
metadata:
  name: zimo-dm-imagenet-smoke-1
  namespace: ucsd-ravigroup
  labels:
    owner: zimo
    project: distance-marching
    run-id: zimo-dm-imagenet-smoke-1
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 7200
  ttlSecondsAfterFinished: 172800
  template:
    metadata:
      labels:
        owner: zimo
        project: distance-marching
        run-id: zimo-dm-imagenet-smoke-1
    spec:
      restartPolicy: Never
      containers:
        - name: compute
          image: zeamoxwang/eqm-a10@sha256:4295547d158ed67d6e6aa7fdd4a7b8c5efd464428e7ac591a099fe856e84a7cd  # :latest amd64 2025-11-01
          imagePullPolicy: IfNotPresent
          env:
            - name: RUN_ID
              value: zimo-dm-imagenet-smoke-1
            - name: HF_HOME
              value: /nvme/hf
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              nvidia-smi
              RUN=/pv/distance-marching-runs/$RUN_ID
              mkdir -p "$RUN"
              cp -r /pv/distance-marching /nvme/code
              cd /nvme/code && git rev-parse HEAD | tee "$RUN/commit.txt"
              cd /nvme/code/imagenet
              python3 -c "import torch, torchvision, diffusers, timm, huggingface_hub; print(torch.__version__, torchvision.__version__, diffusers.__version__, timm.__version__, huggingface_hub.__version__)" | tee "$RUN/versions.txt"
              echo "=== sampling smoke (256 images, st, cfg 2.0) ==="
              mkdir -p /nvme/tmp
              torchrun --nnodes=1 --nproc_per_node=1 sample.py \
                --model DM-B/2 --sampler st --stepsize 0.022 --cfg-scale 2.0 \
                --num-sampling-steps 250 --num-fid-samples 256 \
                --global-batch-size 128 --global-seed 0 \
                --folder "$RUN/samples_smoke" --tmp-dir /nvme/tmp 2>&1 | tee "$RUN/sample_smoke.log"
              echo "=== training smoke: 10 classes, 20 steps ==="
              mkdir -p /nvme/imagenet10/train
              cd /nvme/imagenet10/train
              tar -xf /pv/EqM/ILSVRC2012_img_train.tar $(tar -tf /pv/EqM/ILSVRC2012_img_train.tar | head -10)
              for t in *.tar; do d="${t%.tar}"; mkdir -p "$d"; tar -xf "$t" -C "$d"; rm "$t"; done
              ls | wc -l
              cd /nvme/code/imagenet
              torchrun --nnodes=1 --nproc_per_node=1 train.py \
                --model DM-B/2 --data-path /nvme/imagenet10/train \
                --global-batch-size 64 --epochs 80 --max-steps 20 --global-seed 0 \
                --lr 1e-4 --ema-decay 0.9999 --class-dropout-prob 0.1 \
                --rescale-energy 2.78e-3 --one-step-loss-weight 1.0 --eikonal-loss-weight 30.0 --c 100.0 \
                --num-workers 4 --log-every 5 --ckpt-every 20 \
                --results-dir "$RUN/results" 2>&1 | tee "$RUN/train_smoke.log"
              ls -la "$RUN"/results/*/checkpoints/
              echo "SMOKE DONE"
          resources:
            requests:
              cpu: "8"
              memory: 48Gi
              ephemeral-storage: 100Gi
              nvidia.com/a100: 1
            limits:
              cpu: "8"
              memory: 48Gi
              ephemeral-storage: 100Gi
              nvidia.com/a100: 1
          volumeMounts:
            - name: pv
              mountPath: /pv
            - name: nvme
              mountPath: /nvme
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: pv
          persistentVolumeClaim:
            claimName: zmw-vol-haosu
        - name: nvme
          emptyDir: {}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
